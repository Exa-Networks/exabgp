# issue #1140: RFC 7911 ADD-PATH for FlowSpec, one match announced as two paths
neighbor 127.0.0.1 {
	router-id 1.2.3.4;
	local-address 127.0.0.1;
	local-as 1;
	peer-as 1;
	group-updates false;

	capability {
		add-path send/receive;
	}

	family {
		ipv4 flow;
		ipv4 flow-vpn;
	}

	add-path {
		ipv4 flow;
		ipv4 flow-vpn;
	}

	flow {
		route first-path {
			path-information 1;
			match {
				destination 10.0.0.0/24;
			}
			then {
				discard;
			}
		}
		route second-path {
			path-information 2;
			match {
				destination 10.0.0.0/24;
			}
			then {
				rate-limit 9600;
			}
		}
		route vpn-path {
			rd 65000:1;
			path-information 0.0.0.3;
			match {
				destination 10.0.1.0/24;
			}
			then {
				discard;
			}
		}
	}
}
