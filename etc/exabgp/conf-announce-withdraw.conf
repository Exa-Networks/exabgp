process announce-withdraw {
	run ./run/conf-announce-withdraw.run;
	encoder json;
}

neighbor 127.0.0.1 {
	description "announces and withdraws in the same batch, to watch the UPDATEs split";
	router-id 10.0.0.1;
	local-address 127.0.0.1;
	local-as 65533;
	peer-as 65533;
	group-updates false;

	family {
		ipv4 unicast;
		ipv6 unicast;
	}

	api {
		processes [ announce-withdraw ];
	}
}
