# The peer in the functional suite echoes our OPEN back, so it advertises the PATHS-LIMIT
# below to us as well. Three paths are configured for one prefix and the limit is two, so
# the third must never reach the wire.
neighbor 127.0.0.1 {
	router-id 1.2.3.4;
	local-address 127.0.0.1;
	local-as 1;
	peer-as 1;
	group-updates false;

	capability {
		add-path send/receive;
	}

	family {
		ipv4 unicast;
	}

	add-path {
		ipv4 unicast limit 2;
	}

	static {
		route 193.0.2.0/24 path-information 0.0.0.1 next-hop 10.0.0.1 origin igp;
		route 193.0.2.0/24 path-information 0.0.0.2 next-hop 10.0.0.2 origin igp;
		route 193.0.2.0/24 path-information 0.0.0.3 next-hop 10.0.0.3 origin igp;
	}
}
