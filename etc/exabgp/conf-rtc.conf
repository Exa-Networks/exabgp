# ==============================================================================
# ExaBGP RTC (Route Target Constraint, RFC 4684) Configuration Example
# ==============================================================================
# Route target membership (AFI 1, SAFI 132) tells a peer, usually a route
# reflector, which VPN routes to send: those carrying a route target announced
# here, or all of them for the default route target.
#
#   rtc origin-as <asn> route-target <asn:number|ip:number> next-hop <ip|self>
#   rtc default next-hop <ip|self>
#
# origin-as is the NLRI field; origin (igp, egp, incomplete) stays the ORIGIN
# attribute, which every RTC UPDATE carries.
#
# ExaBGP signals membership only: it does not filter the VPN routes it sends by
# the membership a peer announces to it (RFC 4684 section 5).
# ==============================================================================

neighbor 127.0.0.1 {
	router-id 1.2.3.4;
	local-address 127.0.0.1;
	local-as 65533;
	peer-as 65533;

	family {
		ipv4 rtc;
	}

	announce {
		ipv4 {
			rtc origin-as 65533 route-target 65001:100 next-hop 192.0.2.1;
			rtc origin-as 65533 route-target 192.0.2.1:200 next-hop 192.0.2.1;
			rtc origin-as 65533 route-target 4200000000:300 next-hop 192.0.2.1;
			rtc default next-hop 192.0.2.1;
		}
	}
}
