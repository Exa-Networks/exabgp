process one-shot {
	run ./run/api-on-exit.run;
	encoder json;
	respawn false;
}

neighbor 127.0.0.1 {
	router-id 1.2.3.4;
	local-address 127.0.0.1;
	local-as 1;
	peer-as 1;
	group-updates false;

	family {
		ipv4 unicast;
	}

	capability {
		graceful-restart;
	}

	api {
		processes [ one-shot ];
		neighbor-changes;
		send {
			parsed;
			update;
		}
	}
}
