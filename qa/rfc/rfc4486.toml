# RFC 4486 - Subcodes for BGP Cease Notification Message
# https://www.rfc-editor.org/rfc/rfc4486
#
# Every `text` below is quoted verbatim from qa/rfc/text/rfc4486.txt and is checked
# against it on every run of ./qa/bin/check_rfc_compliance.
#
# Enrolled with the received prefix limit, `prefix-limit N` after a family, which is what
# makes exabgp send Maximum Number of Prefixes Reached, and extended with the operator's
# `disable`, which sends Administrative Shutdown and refuses connections with Connection
# Rejected.  The SHOULDs for the other Cease subcodes, which the teardown command and the
# reactor send, are not yet in this ledger.

rfc = "rfc4486"
title = "Subcodes for BGP Cease Notification Message"
url = "https://www.rfc-editor.org/rfc/rfc4486"


# ============================================================ 4 Subcode Usage

[[requirement]]
id = "rfc4486#4-maximum-prefixes-must-send-subcode-one"
section = "4"
level = "MUST"
status = "required"
polarity = "both"
text = """
If a BGP speaker decides to terminate its peering with a neighbor
because the number of address prefixes received from the neighbor
exceeds a locally configured upper bound (as described in [BGP-4]),
then the speaker MUST send to the neighbor a NOTIFICATION message
with the Error Code Cease and the Error Subcode "Maximum Number of
Prefixes Reached".
"""
note = """
The UPDATE handler raises Notify(6, 1) on the route which takes a family past its
prefix-limit.  The count is of distinct routes the peer holds with us, kept in
IncomingRIB whether or not adj-rib-in is on.
"""

[[requirement]]
id = "rfc4486#4-data-may-carry-the-family-and-the-bound"
section = "4"
level = "MAY"
status = "required"
polarity = "positive-only"
text = """
The message MAY optionally include the Address
Family information [BGP-MP] and the upper bound in the "Data" field,
as shown in Figure 1, where the meaning and use of the <AFI, SAFI>
tuple is the same as defined in [BGP-MP], Section 7.
"""
note = """
Always included: AFI in two octets, SAFI in one, the configured limit in four.  It is
what we send, not something a peer can get wrong, so there is no negative side.
"""

[[requirement]]
id = "rfc4486#4-administrative-shutdown"
section = "4"
level = "SHOULD"
status = "required"
polarity = "positive-only"
text = """
If a BGP speaker decides to administratively shut down its peering
with a neighbor, then the speaker SHOULD send a NOTIFICATION message
with the Error Code Cease and the Error Subcode "Administrative
Shutdown".
"""
note = """
`peer <selector> disable` and `shutdown true` set by a reload close the session with
Notify(6, 2), and keep it closed until `enable`.  Positive only: it constrains what we
send, there is no peer input which violates it.
"""

[[requirement]]
id = "rfc4486#4-connection-rejected"
section = "4"
level = "SHOULD"
status = "required"
polarity = "positive-only"
text = """
If a BGP speaker decides to disallow a BGP connection (e.g., the peer
is not configured locally) after the speaker accepts a transport
protocol connection, then the BGP speaker SHOULD send a NOTIFICATION
message with the Error Code Cease and the Error Subcode "Connection
Rejected".
"""
note = """
Sent to a peer no neighbour matches, and to a disabled neighbour.  The listener sent
(6, 3) Peer De-configured to the first.  A connection from a neighbour a reload has just
removed still gets (6, 3): the peering existed and was de-configured.  Positive only: it
constrains what we send.
"""
