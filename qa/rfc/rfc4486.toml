# RFC 4486 - Subcodes for BGP Cease Notification Message
# https://www.rfc-editor.org/rfc/rfc4486
#
# Every `text` below is quoted verbatim from qa/rfc/text/rfc4486.txt and is checked
# against it on every run of ./qa/bin/check_rfc_compliance.
#
# Enrolled with the received prefix limit, `prefix-limit N` after a family, which is what
# makes exabgp send Maximum Number of Prefixes Reached, and extended with the operator's
# `disable`, which sends Administrative Shutdown and refuses connections with Connection
# Rejected, then with Peer De-configured and Connection Collision Resolution, which the
# reactor sends.  The SHOULDs for the other Cease subcodes, which the teardown command
# sends, are not yet in this ledger.

rfc = "rfc4486"
title = "Subcodes for BGP Cease Notification Message"
url = "https://www.rfc-editor.org/rfc/rfc4486"


# ============================================================ 4 Subcode Usage

[[requirement]]
id = "rfc4486#4-maximum-prefixes-must-send-subcode-one"
section = "4"
level = "MUST"
status = "required"
polarity = "both"
text = """
If a BGP speaker decides to terminate its peering with a neighbor
because the number of address prefixes received from the neighbor
exceeds a locally configured upper bound (as described in [BGP-4]),
then the speaker MUST send to the neighbor a NOTIFICATION message
with the Error Code Cease and the Error Subcode "Maximum Number of
Prefixes Reached".
"""
note = """
The UPDATE handler raises Notify(6, 1) on the route which takes a family past its
prefix-limit (exabgp/rib/prefix_limit.py).  The count is of distinct address prefixes the
peer holds with us, kept in IncomingRIB whether or not adj-rib-in is on: with ADD-PATH the
paths of one prefix count once, and the prefix stops counting when its last path is
withdrawn.  The withdrawn routes of an UPDATE are released before its NLRI are counted
(RFC 4271 9), so a peer at its limit may replace one prefix by another in one UPDATE.  A
flow specification held back by flow-validation (RFC 8955 6) is not in the adj-rib-in and
is not counted; it is counted, with the same Cease past the limit, when revalidation
installs it, and released when revalidation takes it out.
"""

[[requirement]]
id = "rfc4486#4-data-may-carry-the-family-and-the-bound"
section = "4"
level = "MAY"
status = "required"
polarity = "positive-only"
text = """
The message MAY optionally include the Address
Family information [BGP-MP] and the upper bound in the "Data" field,
as shown in Figure 1, where the meaning and use of the <AFI, SAFI>
tuple is the same as defined in [BGP-MP], Section 7.
"""
note = """
Always included: AFI in two octets, SAFI in one, the configured limit in four.  It is
what we send, not something a peer can get wrong, so there is no negative side.
"""

[[requirement]]
id = "rfc4486#4-administrative-shutdown"
section = "4"
level = "SHOULD"
status = "required"
polarity = "positive-only"
text = """
If a BGP speaker decides to administratively shut down its peering
with a neighbor, then the speaker SHOULD send a NOTIFICATION message
with the Error Code Cease and the Error Subcode "Administrative
Shutdown".
"""
note = """
`peer <selector> disable` and `shutdown true` set by a reload close the session with
Notify(6, 2), and keep it closed until `enable`; `teardown` sends the subcode it is given.
Both are sent with Graceful Restart negotiated too: until 2026-10-08 Peer._raise_session_end
closed such a session without a word, and the peer kept our routes as stale for its
Restart Time.  The daemon shutting down sends it to every peer, but to one with Graceful
Restart negotiated, which RFC 4724 wants left to keep our routes while we restart; a
session re-established for a restart or a changed configuration is the same exception.
Positive only: it constrains what we send, there is no peer input which violates it.
"""

[[requirement]]
id = "rfc4486#4-peer-de-configured"
section = "4"
level = "SHOULD"
status = "required"
polarity = "positive-only"
text = """
If a BGP speaker decides to de-configure a peer, then the speaker
SHOULD send a NOTIFICATION message with the Error Code Cease and the
Error Subcode "Peer De-configured".
"""
note = """
A neighbour a reload removes, or the API deletes, is sent (6, 3) by Peer.remove()
on a session which got as far as our OPEN.  It was never sent: the connection was closed
before the Cease was chosen.  Positive only: it constrains what we send.
"""

[[requirement]]
id = "rfc4486#4-connection-rejected"
section = "4"
level = "SHOULD"
status = "required"
polarity = "positive-only"
text = """
If a BGP speaker decides to disallow a BGP connection (e.g., the peer
is not configured locally) after the speaker accepts a transport
protocol connection, then the BGP speaker SHOULD send a NOTIFICATION
message with the Error Code Cease and the Error Subcode "Connection
Rejected".
"""
note = """
Sent to a peer no neighbour matches, and to a disabled neighbour.  The listener sent
(6, 3) Peer De-configured to the first.  A connection from a neighbour a reload has just
removed still gets (6, 3): the peering existed and was de-configured.  Positive only: it
constrains what we send.
"""

[[requirement]]
id = "rfc4486#4-connection-collision-resolution"
section = "4"
level = "SHOULD"
status = "required"
polarity = "positive-only"
text = """
If a BGP speaker decides to send a NOTIFICATION message with the
Error Code Cease as a result of the collision resolution procedure
(as described in [BGP-4]), then the subcode SHOULD be set to
"Connection Collision Resolution".
"""
note = """
Sent on whichever connection the RFC 4271 6.8 comparison closes: the incoming one when our
BGP Identifier is the higher, ours otherwise.  Ours used to be closed without a NOTIFICATION.
Positive only: it constrains what we send.
"""
