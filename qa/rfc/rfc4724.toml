# RFC 4724 - Graceful Restart Mechanism for BGP
# https://www.rfc-editor.org/rfc/rfc4724
#
# Every `text` below is quoted verbatim from qa/rfc/text/rfc4724.txt and is checked
# against it on every run of ./qa/bin/check_rfc_compliance.
#
# Most of this RFC is about what a router does with its forwarding state while its BGP
# is away. exabgp has no forwarding state: it does not touch the FIB, runs no decision
# process and re-advertises nothing. What does bind it is the capability encoding and
# the End-of-RIB marker, and those are where the `required` entries are.
#
# Capability: src/exabgp/bgp/message/open/capability/graceful.py
# End-of-RIB: src/exabgp/bgp/message/update/eor.py

rfc = "rfc4724"
title = "Graceful Restart Mechanism for BGP"
url = "https://www.rfc-editor.org/rfc/rfc4724"

[[requirement]]
id = "rfc4724#3-reserved-bits-are-zero"
section = "3"
level = "MUST"
status = "required"
polarity = "both"
text = """
The remaining bits are reserved and MUST be set to zero by the
sender and ignored by the receiver.
"""
note = """
The document says this twice in the same words, once for the four Restart Flags and once
for the eight Flags for Address Family, and one entry covers both fields because one
sentence is what the ledger can quote. The tests cover both.
"""

[[requirement]]
id = "rfc4724#3-single-capability-instance"
section = "3"
level = "MUST NOT"
status = "required"
polarity = "positive-only"
text = """
A BGP speaker MUST NOT include more than one instance of the Graceful
Restart Capability in the capability advertisement [BGP-CAP].
"""
note = """
Positive only: Capabilities is a dict keyed by capability code, so a second Graceful
Restart capability would replace the first rather than join it, and no configuration or
peer input reaches that container. The meaningful test is on what the packed OPEN carries.
The receiver's half of this rule is the next entry, which does have both sides.
"""

[[requirement]]
id = "rfc4724#3-receiver-keeps-the-last-instance"
section = "3"
level = "MUST"
status = "required"
polarity = "both"
text = """
If
more than one instance of the Graceful Restart Capability is carried
in the capability advertisement, the receiver of the advertisement
MUST ignore all but the last instance of the Graceful Restart
Capability.
"""

[[requirement]]
id = "rfc4724#2-ipv4-unicast-end-of-rib-is-minimum-update"
section = "2"
level = "MUST"
status = "required"
polarity = "both"
text = """
For the IPv4 unicast address family, the End-of-RIB
marker is an UPDATE message with the minimum length [BGP-4].
"""
note = """
The sentence has no RFC 2119 keyword: it is the definition every rule about the marker in
section 4 relies on, so it binds as they do. Reading a marker where none was sent ends the
restart of the family, and removes the stale routes the peer has not sent yet. The marker
used to be decided from what the decoder kept rather than from the wire, so an UPDATE
whose only attribute was discarded (LOCAL_PREF from an external peer, an unrecognised
optional non-transitive attribute) was taken for the IPv4 unicast marker. EOR.from_body
now reads the four octets of the body and nothing else.
"""

[[requirement]]
id = "rfc4724#2-other-family-end-of-rib-is-only-mp-unreach"
section = "2"
level = "MUST"
status = "required"
polarity = "both"
text = """
For any
other address family, it is an UPDATE message that contains only the
MP_UNREACH_NLRI attribute [BGP-MP] with no withdrawn routes for that
<AFI, SAFI>.
"""
note = """
No RFC 2119 keyword, as the entry above. EOR.from_body recognises the body on the wire: no
withdrawn routes, one attribute, MP_UNREACH_NLRI, holding only the AFI and SAFI, with a one
or a two octet attribute length. A flow withdrawal whose NLRI the decoder refused used to
be read as the marker for its family, because nothing was left of it once decoded.
UpdateCollection.unpack_message knew only the two octet length form, and now shares the
same recognition.  The flags must say optional and not transitive; the Partial bit and the
four unused bits are ignored, as the decoder ignores them (RFC 7606 3(c)).  Until
2026-10-08 a marker with Partial set (0xA0, 0xB0) decoded as an empty withdrawal and did
not end the family's restart.
"""

[[requirement]]
id = "rfc4724#4-end-of-rib-must-be-sent"
section = "4"
level = "MUST"
status = "required"
polarity = "both"
text = """
The End-of-RIB marker MUST be sent by a BGP speaker to its peer once
it completes the initial routing update (including the case when
there is no update to send) for an address family after the BGP
session is established.
"""
note = """
Section 2 gives the marker two encodings and they are not interchangeable: for IPv4
unicast it is an UPDATE of the minimum length, and for every other family it is an UPDATE
carrying only MP_UNREACH_NLRI with no withdrawn routes. Sending the IPv4 form for an IPv6
family says "I have finished" about the wrong RIB, so both encodings are tested, in both
directions.
"""

[[requirement]]
id = "rfc4724#4.1-restarting-speaker-sets-restart-state"
section = "4.1"
level = "MUST"
status = "required"
polarity = "both"
text = """
To re-establish the session with its peer, the Restarting Speaker
MUST set the "Restart State" bit in the Graceful Restart Capability
"""
note = """
The sentence ends "of the OPEN message" on the next page, and the page footer sits in
between, so the quote stops at the page break as qa/rfc/README.md requires.
"""

[[requirement]]
id = "rfc4724#4.2-restart-state-not-set-unless-restarted"
section = "4.2"
level = "MUST NOT"
status = "required"
polarity = "positive-only"
text = """
In re-establishing the session, the "Restart State" bit in the
Graceful Restart Capability of the OPEN message sent by the Receiving
Speaker MUST NOT be set unless the Receiving Speaker has restarted.
"""
note = """
Positive only: the bit is ours to set or not, and no peer input decides it, so the only
meaningful test is the one where we have not restarted and must not claim we have. The
entry above covers the case where we have.

The sentence binds re-establishment, and that is the case exabgp can answer. Peer._restarted
starts True and is cleared in Peer._establish() once a session with the neighbor has been
held, so every reconnection after the first session of the process, a TCP reset, a hold
timer, a peer which itself restarted, leaves the bit clear. Only reestablish(), the
`restart` command and a reload which changed the neighbor, sets it again.

The first OPEN of a process still claims a restart, and that is deliberate rather than an
omission: this run may be a restart of an earlier one, in which case 4.1 requires the bit
and a peer is holding our routes, and nothing on the box distinguishes that from a first
start. See the comment on FORCE_GRACEFUL in src/exabgp/reactor/peer/peer.py.
"""

[[requirement]]
id = "rfc4724#4.1-retain-forwarding-state"
section = "4.1"
level = "MUST"
status = "not-applicable"
polarity = "both"
text = """
When the Restarting Speaker restarts, it MUST retain, if possible,
the forwarding state for the BGP routes in the Loc-RIB and MUST mark
them as stale.
"""
note = """
"If possible" is not possible here. exabgp does not manipulate the FIB and has no Loc-RIB:
there is no forwarding state on this box which a BGP restart could lose, and nothing for
another process to keep forwarding through while we are away. A router peering with
exabgp keeps forwarding by its own means.
"""

[[requirement]]
id = "rfc4724#4.1-no-difference-while-forwarding"
section = "4.1"
level = "MUST NOT"
status = "not-applicable"
polarity = "both"
text = """
It MUST NOT differentiate between stale and other
information during forwarding.
"""
note = """
exabgp forwards no packets. It is a BGP speaker with a JSON API and never installs a route
anywhere, so there is no forwarding decision in this process which could treat a stale
route differently from a fresh one.
"""

[[requirement]]
id = "rfc4724#4.1-defer-route-selection"
section = "4.1"
level = "MUST"
status = "not-applicable"
polarity = "both"
text = """
However, it MUST defer route
selection for an address family until it either (a) receives the
End-of-RIB marker from all its peers (excluding the ones with the
"Restart State" bit set in the received capability and excluding the
ones that do not advertise the graceful restart capability) or (b)
the Selection_Deferral_Timer referred to below has expired.
"""
note = """
exabgp runs no best path selection. What it announces is what its configuration and its
API told it to announce, decided before any peer was heard from and unaffected by what
arrives, so there is no selection whose timing this could constrain.
"""

[[requirement]]
id = "rfc4724#4.1-selection-deferral-timer"
section = "4.1"
level = "MUST"
status = "not-applicable"
polarity = "both"
text = """
To put an upper bound on the amount of time a router defers its route
selection, an implementation MUST support a (configurable) timer that
imposes this upper bound.
"""
note = """
A bound on a deferral which never happens. This timer exists to stop a restarting speaker
waiting forever for End-of-RIB before it selects routes, and exabgp selects none: see the
entry above. A configuration knob for it would be a setting which could not change any
behaviour.
"""

[[requirement]]
id = "rfc4724#4.2-retain-and-mark-stale"
section = "4.2"
level = "MUST"
status = "required"
polarity = "both"
text = """
When the Receiving Speaker detects termination of the TCP session for
a BGP session with a peer that has advertised the Graceful Restart
Capability, it MUST retain the routes received from the peer for all
the address families that were previously received in the Graceful
Restart Capability and MUST mark them as stale routing information.
"""
note = """
When a session is lost at the TCP level (Peer._reset with a NetworkError) and the peer's
OPEN carried the Graceful Restart capability, Peer._retain_for_restart marks the routes of
every family in that capability stale in the adj-RIB-in (IncomingRIB.retain_for_restart,
the same stale set RFC 7313 uses) and keeps them. The next session keeps them too
(Peer._resume_incoming), for each family its new OPEN still names with the Forwarding
State bit set; for any other family, or with no capability at all, they are removed at
once, as the same section requires. A NOTIFICATION ends the session without retention.
Only what the adj-RIB-in holds can be retained: with `adj-rib-in false` there is nothing.
A new connection from the peer while the session is established ends the old session the
same way, see rfc4724#4.2-new-connection-ends-old-session.
"""

[[requirement]]
id = "rfc4724#4.2-delete-stale-on-consecutive-restart"
section = "4.2"
level = "MUST"
status = "required"
polarity = "both"
text = """
To deal with possible consecutive restarts, a route (from the peer)
previously marked as stale MUST be deleted.
"""
note = """
IncomingRIB.retain_for_restart used to mark every route held stale, those still stale from
the previous restart included, so a peer which restarted again before its End-of-RIB had
the routes it never sent again retained for one more Restart Time, and for ever if it kept
restarting. It now deletes what is still stale before marking the rest, and
Peer._retain_for_restart tells the API processes as a withdrawal, the way an expired
Restart Time does. A lost TCP session and a new connection replacing an established
session (Peer._replace_restarted_session) both go through it.
"""

[[requirement]]
id = "rfc4724#4.2-new-connection-ends-old-session"
section = "4.2"
level = "MUST"
status = "required"
polarity = "both"
text = """
MUST treat the subsequent open connection from the peer as an
indication of the termination of the old TCP session and act
accordingly (when the Graceful Restart Capability has been received
from the peer).
"""
note = """
The start of the sentence is on the previous page of the RFC: a Receiving Speaker which
did not detect the termination of the TCP session, and still holds the BGP session as
established. Peer.handle_connection holds a connection arriving in ESTABLISHED when the
peer's OPEN on that session carried the Graceful Restart capability, sends our OPEN on it
at once, and reads its OPEN. Only an OPEN the session would accept (Negotiated.validate,
against the OPEN we sent on the new connection) ends the session as a lost TCP connection
would be ended (Peer._replace_restarted_session): the routes are retained as stale
(rfc4724#4.2-retain-and-mark-stale), and the new session goes on from the two OPENs
already exchanged, sending no second one. A connection which sends no OPEN within
bgp.openwait, or an OPEN failing validation, is closed and the old session is left up.

That is a deliberate deviation. The sentence acts on the connection itself, and section 7
accepts the denial of service this opens, leaving it to TCP authentication. exabgp waits
for a valid OPEN on the new connection before ending the old session, because ending it on
the TCP handshake let anything reaching us from the peer's address reset it. Our OPEN is
sent first so a peer which waits for it before sending its own (DelayOpen) is not stalled
by the wait. With no local-as we mirror the AS the peer's OPEN names, so then we read
first, as every session mirroring the AS does.

Only a connection which arrived during the established session is treated so. One held as
an RFC 4271 6.8 collision in OpenSent is still a collision when ours reaches ESTABLISHED
before its OPEN is read, and is closed with Connection Collision Resolution. Without the
capability RFC 4271 6.8 applies, and the new connection is refused with Connection
Collision Resolution.
"""

[[requirement]]
id = "rfc4724#4.2-old-session-closed-without-notification"
section = "4.2"
level = "MUST"
status = "required"
polarity = "positive-only"
text = """
"Acting accordingly" in this context means that the previous TCP
session MUST be closed, and the new one retained.
"""
note = """
Positive only: whether there is anything to act on is the entry above, whose negative test
is the peer which did not advertise the capability. The task running the old session is
cancelled, its connection is closed without a NOTIFICATION (the RFC's next sentence), and
the incoming connection becomes the session. Deliberately, only once that connection has
sent an OPEN which passes validation (see rfc4724#4.2-new-connection-ends-old-session):
until then, and if it never does, the previous session is kept and the new one is closed.
"""

[[requirement]]
id = "rfc4724#4.2-delete-stale-after-restart-time"
section = "4.2"
level = "MUST"
status = "required"
polarity = "positive-only"
text = """
If the session does not get re-established within the "Restart Time"
that the peer advertised previously, the Receiving Speaker MUST
delete all the stale routes from the peer that it is retaining.
"""
note = """
The loss of the session starts a timer of the peer's advertised Restart Time
(Peer._restart_timer); a new session cancels it, and if it fires first every stale route of
the peer is removed and the API processes are told, as a withdrawal.
"""

[[requirement]]
id = "rfc4724#4.2-remove-stale-on-end-of-rib"
section = "4.2"
level = "MUST"
status = "required"
polarity = "positive-only"
text = """
Once the End-of-RIB marker for an
address family is received from the peer, it MUST immediately remove
any routes from the peer that are still marked as stale for that
address family.
"""
note = """
UpdateHandler._end_of_rib removes the routes of the family still marked stale from the
restart (IncomingRIB.end_restart) when the peer's End-of-RIB for it arrives, and tells the
API processes as a withdrawal. Before the marker nothing stale is removed; a route the peer
sends again stops being stale.
"""
