# RFC 8654 - Extended Message Support for BGP
# https://www.rfc-editor.org/rfc/rfc8654
#
# Every `text` below is quoted verbatim from qa/rfc/text/rfc8654.txt and is checked
# against it on every run of ./qa/bin/check_rfc_compliance.
#
# The two directions of a session are separate: what we receive is bounded by what we
# advertised, Negotiated.receive_msg_size, which Peer._establish gives the connection once
# our OPEN has gone out; what we send by what the peer advertised, Negotiated.msg_size.

rfc = "rfc8654"
title = "Extended Message Support for BGP"
url = "https://www.rfc-editor.org/rfc/rfc8654"

[[requirement]]
id = "rfc8654#4-receive-up-to-65535-when-advertised"
section = "4"
level = "MUST"
status = "required"
polarity = "both"
text = """
An implementation that advertises the BGP Extended Message Capability
MUST be capable of receiving a message with a length up to and
including 65,535 octets.
"""
note = """
Until 2026-10-08 the limit on receipt rose only when both sides had advertised the
capability, so a peer which used our advertisement without advertising its own was
refused, and a session with no local-as (mirroring the peer's AS) copied the limit before
its own OPEN was sent and kept 4096 octets for its life.  Both are tested, with and
without the peer's capability.  The negative test is a session which did not advertise
it, whose limit stays 4096.
"""

[[requirement]]
id = "rfc8654#4-send-only-if-received"
section = "4"
level = "MAY"
status = "required"
polarity = "both"
text = """
A BGP speaker MAY
send BGP Extended Messages to a peer only if the BGP Extended Message
Capability was received from that peer.
"""
note = """
Negotiated.msg_size, the size UPDATEs are split to, is 65535 only when the peer's OPEN
carried the capability.  It also asks for ours to have been sent: the MAY is declined
towards a peer we told we could not take them, which is the conservative reading and the
behaviour exabgp always had.
"""

[[requirement]]
id = "rfc8654#5-not-advertised-not-accepted"
section = "5"
level = "MUST NOT"
status = "required"
polarity = "both"
text = """
A BGP speaker that has the ability to use BGP Extended Messages but
has not advertised the BGP Extended Message Capability, presumably
due to configuration, MUST NOT accept a BGP Extended Message.
"""
note = """
Without our capability the connection's limit stays 4096 octets, whatever the peer
advertised, and a longer message is refused by Connection.reader_async with Bad Message
Length (RFC 4271 6.1), as section 4 says the listener does.
"""
