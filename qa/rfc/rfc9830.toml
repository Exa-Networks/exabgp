# RFC 9830 - Advertising Segment Routing Policies in BGP
# https://www.rfc-editor.org/rfc/rfc9830
#
# Every `text` below is quoted verbatim from qa/rfc/text/rfc9830.txt.
#
# This ledger is deliberately narrow.  Almost all of RFC 9830 is addressed to an SR
# Policy headend: it computes candidate paths, runs the SRPM, validates SIDs and
# instantiates policies.  exabgp does none of that.  What it does is decode the SR Policy
# NLRI and the tunnel TLV that goes with it, and originate the routes an operator
# configures, so the entries below are the ones which bind a decoder, the validity rules
# of section 4.2.1 a received update is held to, and the one rule of section 4.1 on what
# an originator attaches.

rfc = "rfc9830"
title = "Advertising Segment Routing Policies in BGP"
url = "https://www.rfc-editor.org/rfc/rfc9830"

[[requirement]]
id = "rfc9830#2.1-afi-must-be-ipv4-or-ipv6"
section = "2.1"
level = "MUST"
status = "required"
polarity = "both"
text = """
The AFI used MUST be IPv4(1) or IPv6(2).
"""
note = """
`SRPolicyNLRI` is registered under `(AFI.ipv4, SAFI.sr_policy)` and `(AFI.ipv6,
SAFI.sr_policy)` and under nothing else, so an MP_REACH naming any other AFI with SAFI 73
finds no decoder.  The negative side is that registration table: a third AFI must not
resolve to this class.
"""

[[requirement]]
id = "rfc9830#2.1-nlri-length-96-or-192"
section = "2.1"
level = "MUST"
status = "required"
polarity = "both"
text = """
NLRI Length:  1 octet indicating the length expressed in bits as
defined in [RFC4760].  When AFI = 1, the value MUST be 96; when
AFI = 2, the value MUST be 192.
"""
note = """
`SRPolicyNLRI.unpack_nlri` computes the expected bit count from the AFI it was called
with and raises `Notify(3, 10)` on anything else, before it slices.  This entry also
answers a standing suspicion that a malformed Endpoint could silently pick the wrong
address family: it cannot.  The `endpoint` property reads four or sixteen octets
according to `self.afi`, and `self.afi` comes from the MP_REACH, not from the NLRI body,
so the only way to reach the sixteen octet read is to have passed the 192 bit check.  A
length byte of 96 arriving under AFI 2, which is the shape that would have produced a
four octet address read as an IPv6 one, is refused.
"""

[[requirement]]
id = "rfc9830#2.1-next-hop-independent-of-afi"
section = "2.1"
level = "MAY"
status = "required"
polarity = "both"
text = """
The next-hop network address field in SR Policy SAFI (73) updates may
be either a 4-octet IPv4 address or a 16-octet IPv6 address,
independent of the SR Policy AFI.  The Length field of the next-hop
address specifies the next-hop address family.  If the next-hop
length is 4, then the next-hop is an IPv4 address.  If the next-hop
length is 16, then it is a global IPv6 address.  If the next-hop
length is 32, then it has a global IPv6 address followed by a link-
local IPv6 address.
"""
note = """
The "may" is lower case, but it is the sender's freedom, so it binds the receiver: a
speaker refusing what a peer may send resets a valid session.  `Family.size` gave AFI 1
the length 4 alone and AFI 2 the length 16 alone, so a valid IPv6 next hop on AFI 1 was
answered with Notify(3, 9).  Both AFIs now take 4, 16 and 32, and nothing else.  The
encoder sends an IPv4 next hop as four octets under AFI 2, where it used to send the
IPv4-mapped form.
"""

[[requirement]]
id = "rfc9830#2.4-single-sr-policy-tlv"
section = "2.4"
level = "MUST NOT"
status = "required"
polarity = "both"
text = """
A Tunnel Encapsulation Attribute MUST NOT contain more than one TLV
of type "SR Policy"; such updates MUST be considered malformed and
handled by the "treat-as-withdraw" strategy [RFC7606].
"""
note = """
`TunnelEncap.unpack_attribute` counts the TLVs of tunnel type 15 as it walks them and
raises `Notify(3, 1)` on the second, which `TunnelEncap.TREAT_AS_WITHDRAW` turns into
`INTERNAL_TREAT_AS_WITHDRAW` in `AttributeCollection.parse`, so the route goes and the
session stays.  The check names the SR Policy tunnel type rather than tunnel TLVs in
general, which is the negative test: a route may carry a second tunnel TLV of another
type, and that one is not a duplicate.  Note how much louder this is than RFC 9012 13 for
a repeated sub-TLV, where the repeat is disregarded and the route kept.
"""

[[requirement]]
id = "rfc9830#2.4.4.2.3-unassigned-segment-flags-zero"
section = "2.4.4.2.3"
level = "MUST"
status = "required"
polarity = "both"
text = """
The unassigned bits in the Flags field MUST be set to zero upon
transmission and MUST be ignored upon receipt.
"""
note = """
This entry exists because reading RFC 9830 on its own gets the answer wrong.  Its IANA
table (Section 6.8, Table 8) shows bits 1-2 and 4-7 of the Segment Flags as Unassigned,
and `segment_list.py` sets bit 2 (0x20) on every Segment Type C to K it packs, which
reads as a reserved bit going out set.  It is not one: RFC 9831, the companion published
alongside 9830 which defines Segment Types C to K, allocates bit 1 to the A-Flag and bit
2 to the S-Flag in its own IANA section (Section 3.2, Table 2) and describes them in
Section 2.10.  Bits 4-7 are all that remain unassigned, so those are what this
requirement now binds, and the comment above the flag constants says so in the code.

The positive side is that nothing exabgp originates puts anything in bits 4-7:
`configuration/static/sr_policy.py` only ever raises 0x80, 0x40 and 0x10, and `pack()`
derives 0x20 from whether a SID is present.  The negative side is receipt: a peer which
sets bits 4-7 anyway must not change how the segment decodes, and does not, because no
decoder here reads them.
"""

[[requirement]]
id = "rfc9830#4.1-no-advertise-without-route-target"
section = "4.1"
level = "MUST"
status = "required"
polarity = "both"
text = """
   If no route target is attached to the SR Policy NLRI, then it is
   assumed that the originator sends the SR Policy update directly
   (e.g., through a BGP session) to the intended receiver.  In such a
   case, the NO_ADVERTISE community [RFC1997] MUST be attached to the SR
   Policy update (see further details in Section 4.2.3).
"""
note = """
exabgp originates whatever the operator configures, so the configuration is where this is
kept: an announced `sr-policy` route takes `community [ ... ]` and `extended-community
[ ... ]` among its sub-TLVs, and one with neither NO_ADVERTISE nor a route target in
IPv4-address format is refused with the reason (`SRPolicyNLRI.malformed_with`, the rule
the receiver applies, called by `sr_policy_route`). The route line used to ignore every
word after the sub-TLVs, so no SR policy route could carry a community at all. Stricter
than this sentence by the receiver's rule: a route target in AS format alone does not
count, as section 4.2.1 does not let it make the update valid. A withdrawal is not
checked, it carries no attribute.
"""

[[requirement]]
id = "rfc9830#4.2.1-no-advertise-or-ipv4-route-target"
section = "4.2.1"
level = "MUST"
status = "required"
polarity = "both"
text = """
   *  The SR Policy update MUST have either the NO_ADVERTISE community,
      at least one Route Target extended community in IPv4-address
      format, or both.  If a router supporting this specification
      receives an SR Policy update with no Route Target extended
      communities and no NO_ADVERTISE community, the update MUST be
      considered to be malformed.
"""
note = """
`SRPolicyNLRI.malformed_with` looks for 0xFFFFFF02 in COMMUNITY and for an extended
community of type 0x01 subtype 0x02 in EXTENDED_COMMUNITY. `UpdateCollection` asks every
route of a received MP_REACH_NLRI, and an SR Policy update without either is
treat-as-withdraw (rfc9830#5-invalid-update-treat-as-withdraw). The configuration refuses
to announce one (rfc9830#4.1-no-advertise-without-route-target). Neither was checked: an
SR Policy route with no community was installed and reported to the API as announced.
"""

[[requirement]]
id = "rfc9830#4.2.1-tunnel-encapsulation-attached"
section = "4.2.1"
level = "MUST"
status = "required"
polarity = "both"
text = """
   *  The Tunnel Encapsulation Attribute MUST be attached to the BGP
      UPDATE message and MUST have a Tunnel Type TLV set to SR Policy
      (code point is 15).
"""
note = """
The same check, `SRPolicyNLRI.malformed_with`: a TunnelEncap holding a TLV of tunnel type
15. A received update without one is treat-as-withdraw, which includes the case where
RFC 9012 11 filtered the attribute off an external session, as the route is then not
usable either. The configuration refuses an announced `sr-policy` route with no sub-TLV,
which used to go out with no Tunnel Encapsulation attribute at all.
"""

[[requirement]]
id = "rfc9830#5-invalid-update-treat-as-withdraw"
section = "5"
level = "MUST"
status = "required"
polarity = "both"
text = """
   An SR Policy update that is determined not to be valid (and,
   therefore, malformed) based on the rules described in Section 4.2.1
   MUST be handled by the "treat-as-withdraw" strategy.
"""
note = """
`UpdateCollection._withdrawn_for_its_routes` adds a TreatAsWithdraw marker when a route
of MP_REACH_NLRI answers `malformed_with`, and `_routes` then moves every route of the
UPDATE to the withdrawals, as RFC 7606 2 defines the strategy. Decided in the UPDATE, as
the rule needs the NLRI and its sibling attributes together. The reason is logged.
"""

[[requirement]]
id = "rfc9830#2.4.1-preference-once"
section = "2.4.1"
level = "MUST NOT"
status = "required"
polarity = "both"
text = """
   The Preference sub-TLV is OPTIONAL; it MUST NOT appear more than once
   in the SR Policy encoding.
"""
note = """
The configuration and the API refuse a second Preference sub-TLV in one policy
(`sr_policy._values`, `SINGLE_SUBTLVS`); until 2026-10-08 only ENLP was refused, and a
repeat of any other was packed and sent.
What a receiver does with a repeat is RFC 9012 13's: "all but the first occurrence of each
such sub-TLV type MUST be disregarded", the route is not malformed.  `SRPolicyTunnel.json`
reports the first and disregards the rest, the negative test.
"""

[[requirement]]
id = "rfc9830#2.4.2-binding-sid-once"
section = "2.4.2"
level = "MUST NOT"
status = "required"
polarity = "both"
text = """
