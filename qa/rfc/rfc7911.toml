# RFC 7911 - Advertisement of Multiple Paths in BGP
# https://www.rfc-editor.org/rfc/rfc7911
#
# Every `text` below is quoted verbatim from qa/rfc/text/rfc7911.txt and is checked
# against it on every run of ./qa/bin/check_rfc_compliance.

rfc = "rfc7911"
title = "Advertisement of Multiple Paths in BGP"
url = "https://www.rfc-editor.org/rfc/rfc7911"

[[requirement]]
id = "rfc7911#3-prepend-path-identifier"
section = "3"
level = "MUST"
status = "required"
polarity = "both"
text = """
In order to carry the Path Identifier in an UPDATE message, the NLRI
encoding MUST be extended by prepending the Path Identifier field,
which is of four octets.
"""
note = """
The decode side of this was broken for EVPN, BGP-LS, MVPN, MUP and SR-Policy until
2026-09-24: they never took the four octets off, so every NLRI after the first in the
same UPDATE was read from the wrong offset. The negative side, that the field is absent
when ADD-PATH was not negotiated, is what makes the positive side mean anything.
"""

[[requirement]]
id = "rfc7911#2-identifier-uniquely-identifies-a-path"
section = "2"
level = "MUST"
status = "required"
polarity = "positive-only"
text = """
However, the Path Identifier MUST be assigned
in such a way that the BGP speaker is able to use the (Prefix, Path
Identifier) to uniquely identify a path advertised to a neighbor.
"""
note = """
Positive only: this is a property of the identifiers we assign, so the meaningful test
is that two paths for one prefix stay distinct through the RIB. There is no peer input
which violates it, so there is nothing for a negative test to feed us.
"""

[[requirement]]
id = "rfc7911#2-readvertise-generates-own-identifier"
section = "2"
level = "MUST"
status = "gap"
polarity = "both"
text = """
A
BGP speaker that re-advertises a route MUST generate its own Path
Identifier to be associated with the re-advertised route.
"""
note = """
exabgp does not re-advertise: it is not a route server and has no path selection between
peers, so no route it sends was learned from another session. Recorded as a gap rather
than not-applicable because a future route-server mode would owe it.
"""

[[requirement]]
id = "rfc7911#4-single-capability-instance"
section = "4"
level = "MUST"
status = "required"
polarity = "both"
text = """
A BGP speaker that wishes to indicate support for multiple AFI/SAFIs
MUST do so by including the information in a single instance of the
ADD-PATH Capability.
"""

[[requirement]]
id = "rfc7911#5-send-requires-both-directions"
section = "5"
level = "MUST"
status = "required"
polarity = "both"
text = """
For a BGP speaker to be able to send multiple paths to its peer, that
BGP speaker MUST advertise the ADD-PATH Capability with the Send/
Receive field set to either 2 or 3, and MUST receive from its peer
the ADD-PATH Capability with the Send/Receive field set to either 1
or 3, for the corresponding <AFI, SAFI>.
"""

[[requirement]]
id = "rfc7911#5-extended-encoding-only-when-negotiated"
section = "5"
level = "MUST"
status = "required"
polarity = "both"
text = """
A BGP speaker MUST follow the procedures defined in [RFC4271] when
generating an UPDATE message for a particular <AFI, SAFI> to a peer
unless the BGP speaker advertises the ADD-PATH Capability to the peer
indicating its ability to send multiple paths for the <AFI, SAFI>,
and also receives the ADD-PATH Capability from the peer indicating
its ability to receive multiple paths for the <AFI, SAFI>, in which
case the speaker MUST generate a route update for the <AFI, SAFI>
based on the combination of the address prefix and the Path
Identifier, and use the extended NLRI encodings specified in this
document.
"""

[[requirement]]
id = "rfc7911#4-unknown-send-receive-ignored"
section = "4"
level = "SHOULD"
status = "required"
polarity = "both"
text = """
If any other value is received, then the capability SHOULD be
treated as not understood and ignored [RFC5492].
"""

[[requirement]]
id = "rfc7911#5-unknown-withdraw-identifier-ignored"
section = "5"
level = "SHOULD"
status = "required"
polarity = "positive-only"
text = """
If a BGP speaker
receives a message to withdraw a prefix with a Path Identifier not
seen before, it SHOULD silently ignore it.
"""
note = """
Positive only: the requirement is that nothing happens, so the test is that the session
survives and the RIB is unchanged. There is no second side to it.
"""

[[requirement]]
id = "rfc7911#5-include-best-route"
section = "5"
level = "SHOULD"
status = "not-applicable"
polarity = "both"
text = """
A BGP speaker SHOULD include the best route [RFC4271] when more than
one path is advertised to a neighbor, unless it is a path received
from that neighbor.
"""
note = """
exabgp announces what its configuration and its API tell it to announce. It runs no
decision process and has no notion of a best route to include or omit, so the obligation
has nothing to bind to.
"""
