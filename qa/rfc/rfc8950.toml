# RFC 8950 - Advertising IPv4 Network Layer Reachability Information (NLRI) with an IPv6 Next Hop
# https://www.rfc-editor.org/rfc/rfc8950
#
# Every `text` below is quoted verbatim from qa/rfc/text/rfc8950.txt and is checked
# against it on every run of ./qa/bin/check_rfc_compliance.
#
# The two sentences which bind what crosses the wire: how a receiver reads the Next Hop
# field, and when a sender may put an IPv6 address in it.  The capability encoding of
# section 4 is negotiated in bgp/message/open/capability/nexthop.py and is not reached
# here, so it is absent rather than excused.

rfc = "rfc8950"
title = "Advertising IPv4 Network Layer Reachability Information (NLRI) with an IPv6 Next Hop"
url = "https://www.rfc-editor.org/rfc/rfc8950"

[[requirement]]
id = "rfc8950#3-length-determines-next-hop-protocol"
section = "3"
level = "MUST"
status = "required"
polarity = "both"
text = """
The BGP speaker receiving the advertisement MUST use the Length of
Next Hop Address field to determine which network-layer protocol the
next-hop address belongs to.
"""
note = """
`next_hop_lengths` in protocol/family.py gives the lengths a family takes on a session:
its own, and 16 or 32 (24 or 48 behind an RD) for an IPv4 <AFI, SAFI> which negotiated an
IPv6 next hop, for that <AFI, SAFI> only.  The decoder used to switch every family to the
table of the AFI the length suggested once any entry was negotiated: a family never
negotiated took an IPv6 next hop, and EVPN, VPLS and BGP-LS raised KeyError.
"""

[[requirement]]
id = "rfc8950#4-advertise-only-after-capability"
section = "4"
level = "MUST"
status = "required"
polarity = "both"
text = """
A BGP speaker MUST only advertise the IPv4 or VPN-IPv4 NLRI with an
IPv6 next hop to a BGP peer if the BGP speaker has first ascertained
via the BGP Capability Advertisement that the BGP peer supports the
Extended Next Hop Encoding capability for the relevant AFI/SAFI pair.
"""
note = """
`MPNLRICollection.packed_reach_attributes` leaves out, with a warning, an IPv4 route of
SAFI 1, 2, 4 or 128 whose next hop is IPv6 unless that <AFI, SAFI> negotiated an IPv6 next
hop.  The configuration refuses such a route before it is sent; this is what holds for an
API announcement, or a peer which withheld the capability.
"""

[[requirement]]
id = "rfc8950#4-triple-says-what-may-be-advertised"
section = "4"
level = "MAY"
status = "required"
polarity = "both"
text = """
each triple <NLRI AFI, NLRI SAFI, Nexthop AFI> indicates that
the NLRI of <NLRI AFI / NLRI SAFI> may be advertised with a
next-hop address belonging to the network-layer protocol of
Nexthop AFI.
"""
note = """
A triple is a statement by the speaker which sends it about what it accepts, so the two
directions of a session are decided by different OPENs.  What the peer may send us is
what our OPEN offered, `Negotiated.nexthop_receive`, and the MP_REACH_NLRI decoder uses
that.  It used the intersection of both OPENs, so a peer which did not advertise a triple
of its own had the IPv6 next hops we asked for refused with a NOTIFICATION.  What we send
keeps the intersection, `Negotiated.nexthop`: the peer's triple is what section 4 asks
for, and ours is the operator's consent to an IPv6 next hop for the family.
"""

[[requirement]]
id = "rfc8950#4-capability-fields"
section = "4"
level = "MUST"
status = "required"
polarity = "positive-only"
text = """
The fields
in the Capabilities Optional Parameter MUST be set as follows:
"""
note = """
The value is a list of <NLRI AFI, NLRI SAFI, Nexthop AFI> triples, one per family the
speaker accepts an IPv6 next hop for.  A neighbour with `nexthop` enabled and no triple
to offer (none configured, only some outside section 4's list, or a multisession
session for a family without one) sent the capability with a value of zero octets,
which says nothing.  It is now left out.  Positive only: an obligation on our OPEN.
"""
