[project]
name = 'exabgp'
version = '6.0.0'
description = 'BGP swiss army knife'
authors = [
	{ name = "Thomas Mangin", email = "thomas.mangin@exa-networks.co.uk" },
]
license = 'BSD-3-Clause'
license-files = ['LICENCE.txt']
requires-python = ">=3.12"
keywords = [
	'bgp',
	'ddos-protection',
	'health-check',
	'flowspec',
	'bgp-ls',
	'mpls',
	'vpls',
	'ipv4',
	'ipv6',
	'sdn',
	'high-availability',
]
classifiers = [
	'Development Status :: 5 - Production/Stable',
	'Environment :: Console',
	'Intended Audience :: System Administrators',
	'Intended Audience :: Telecommunications Industry',
	'Operating System :: POSIX',
	'Operating System :: MacOS :: MacOS X',
	'Programming Language :: Python',
	'Programming Language :: Python :: 3.12',
	'Programming Language :: Python :: 3.13',
	'Programming Language :: Python :: 3.14',
	'Programming Language :: Python :: 3.15',
	'Topic :: Internet',
]
readme = 'README.md'
dependencies = []


[project.urls]
Repository = 'https://github.com/Exa-Networks/exabgp'
Homepage = 'https://github.com/Exa-Networks/exabgp'
Documentation = 'https://github.com/Exa-Networks/exabgp/wiki'
Issues = 'https://github.com/Exa-Networks/exabgp/issues'
Changelog = 'https://github.com/Exa-Networks/exabgp/blob/main/doc/CHANGELOG.rst'


[project.scripts]
exabgp = 'exabgp.application.main:main'
exabgp-cli = 'exabgp.application.cli:main'
exabgp-healthcheck = 'exabgp.application.healthcheck:main'


[dependency-groups]
dev = [
	"ruff",
	"mypy",
	"pytest>=9.0.3",
	"pytest-asyncio",
	"pytest-cov",
	"coveralls",
	"psutil",
	"hypothesis>=6.0",
	"pytest-benchmark>=4.0",
	"pytest-xdist>=3.0",
	"pytest-timeout>=2.0",
	"mutmut>=3.0",
	"setuptools",
	"pyinstaller",
	# asyncore for the test peer of 4.2, which qa/bin/test_old_scripts runs: Python 3.12 removed it
	"pyasyncore",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]


[build-system]
requires = ["setuptools", "wheel"]
# include = ["*.txt", "*.rst"]


[tool.pytest.ini_options]
# Bare `pytest` and `pytest ./tests` have to mean the same thing, or the pipeline and a
# developer at a prompt are running different suites and only one of them is right.
#
# They did not.  Bare pytest collected 5198 with 8 errors against 5193 clean, because it
# walked mutants/, mutmut's 33M working copy of the tree, which is gitignored and holds a
# stale duplicate of every test.  Anyone typing pytest in this repository after a mutation
# round got errors out of an artefact.
#
# Session 5.0 found the same setting missing on their branch, where the two agreed only
# because nothing outside tests/ happened to be named test_*.py.  That is a fact about a
# layout rather than a setting, which is the divergence we spent today's rounds on, waiting
# rather than arrived.
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
	"fuzz: Fuzzing tests using Hypothesis (deselect with '-m \"not fuzz\"')",
	"asyncio: Async tests using pytest-asyncio",
	"timeout: Test timeout in seconds (requires pytest-timeout plugin)",
	"registry_floor: asserts the registry this file sweeps or parametrises from is whole",
	"rfc: names the RFC requirements a test proves, joined to qa/rfc/ by ./qa/bin/check_rfc_compliance",
]

[tool.ruff]
line-length = 120
exclude = ["dev", "lib/exabgp/vendoring", "build", "site-packages", "qa/old"]

