[project]
name = 'exabgp'
version = '6.0.0'
description = 'BGP swiss army knife'
authors = [
	{ name = "Thomas Mangin", email = "thomas.mangin@exa-networks.co.uk" },
]
license = 'BSD-3-Clause'
license-files = ['LICENCE.txt']
requires-python = ">=3.12"
keywords = [
	'bgp',
	'ddos-protection',
	'health-check',
	'flowspec',
	'bgp-ls',
	'mpls',
	'vpls',
	'ipv4',
	'ipv6',
	'sdn',
	'high-availability',
]
classifiers = [
	'Development Status :: 5 - Production/Stable',
	'Environment :: Console',
	'Intended Audience :: System Administrators',
	'Intended Audience :: Telecommunications Industry',
	'Operating System :: POSIX',
	'Operating System :: MacOS :: MacOS X',
	'Programming Language :: Python',
	'Programming Language :: Python :: 3.12',
	'Programming Language :: Python :: 3.13',
	'Programming Language :: Python :: 3.14',
	'Topic :: Internet',
]
readme = 'README.md'
dependencies = []


[project.urls]
Repository = 'https://github.com/Exa-Networks/exabgp'
Homepage = 'https://github.com/Exa-Networks/exabgp'
Documentation = 'https://github.com/Exa-Networks/exabgp/wiki'
Issues = 'https://github.com/Exa-Networks/exabgp/issues'
Changelog = 'https://github.com/Exa-Networks/exabgp/blob/main/doc/CHANGELOG.rst'


[project.scripts]
exabgp = 'exabgp.application.main:main'
exabgp-cli = 'exabgp.application.cli:main'
exabgp-healthcheck = 'exabgp.application.healthcheck:main'


[dependency-groups]
dev = [
	"ruff",
	"mypy",
	"pytest>=9.0.3",
	"pytest-asyncio",
	"pytest-cov",
	"coveralls",
	"psutil",
	"hypothesis>=6.0",
	"pytest-benchmark>=4.0",
	"pytest-xdist>=3.0",
	"pytest-timeout>=2.0",
	"mutmut>=3.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]


[build-system]
requires = ["setuptools", "wheel"]
# include = ["*.txt", "*.rst"]


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
	"fuzz: Fuzzing tests using Hypothesis (deselect with '-m \"not fuzz\"')",
	"asyncio: Async tests using pytest-asyncio",
	"timeout: Test timeout in seconds (requires pytest-timeout plugin)",
]

[tool.ruff]
line-length = 120
exclude = ["dev", "lib/exabgp/vendoring", "build", "site-packages", "src/exabgp/vendoring"]

[tool.ruff.lint]
# Select same critical error codes as flake8 configuration:
# E9: Runtime/syntax errors
# F63: Invalid print statements
# F7: Syntax errors in docstrings and type comments
# F82: Undefined names in __all__
# select = ["E9", "F63", "F7", "F82"]

# Ignore specific rules:
# ERA001: Commented-out code (intentional in this codebase)
ignore = ["ERA001"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true


# E131 continuation line unaligned for hanging indent
# E203 whitespace before ':'
# E222 multiple spaces after operator
# E231 missing whitespace after ','
# E241 multiple spaces after ':'
# E266
# E501 line too long
# W191
# W503
# F401 imported but unused
# F403
# the last , is required otherwise the last error ignore is not applied


[tool.mypy]
# Type annotation project started: 2025-11-12
# Strict mode enabled: 2025-12-17 (no regressions allowed)
# Note: Using 3.12 for mypy to match minimum supported version
python_version = "3.12"

# Strict mode - prevent any type regressions
strict = true
warn_unused_configs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true

# Strict enforcement - no untyped code allowed
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Import handling
follow_imports = "normal"
ignore_missing_imports = true

# Custom stubs for PEP 688 Buffer protocol (mypy doesn't fully support it yet)
mypy_path = "stubs"

# Exclude vendored code
exclude = [
    "src/exabgp/vendoring/",
]

# All modules now use global strict settings (2025-12-17)
# No per-module overrides needed

[tool.mutmut]
# mutation testing: does the test suite notice when the code changes meaning?
# scoped to the code which validates what a peer or an operator sends, mutating all of
# src/exabgp would take hours and say little about the parts under test
#
# WHAT MUTMUT CANNOT SEE HERE. It does not mutate the methods of a DECORATED class, and
# every NLRI decoder is @NLRI.register decorated, so listing one buys nothing: inet, ipvpn,
# label, rtc and vpls each produce zero mutants. cidr produces 42 because its class carries
# no decorator, and flow produces 81 from its module level functions and its undecorated
# component classes, not from Flow itself.
#
# The list below is therefore what mutmut can actually report on. Adding a module whose
# validation lives in a decorated class makes the configuration claim a coverage it does
# not have, which is the failure this whole series kept running into.
paths_to_mutate = [
	"src/exabgp/util/psk.py",
	"src/exabgp/bgp/message/update/nlri/cidr.py",
	"src/exabgp/bgp/message/update/nlri/flow.py",
	"src/exabgp/reactor/api/command/group.py",
]
# produce no mutants, because their validation lives in a decorated class:
#   src/exabgp/bgp/message/update/nlri/{inet,ipvpn,label,rtc,vpls}.py
#   src/exabgp/bgp/message/update/attribute/aigp.py
tests_dir = ["tests/unit/", "tests/fuzz/"]
do_not_mutate = ["*/vendoring/*"]
# the tests import the whole package, so the modules which are not mutated have to be
# there too, copied before the mutants are written over the files being mutated
also_copy = ["src/", "sbin/", "etc/", "qa/"]
