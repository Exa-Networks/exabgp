# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit Testing

on:
  push:
    branches: [main, 5.0, 4.2, 3.4]
  pull_request:
    branches: [main, 5.0]

permissions:
  contents: read

jobs:
  unit-tests:
    # runs-on: ubuntu-latest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r qa/requirements.txt

      - name: pytest
        run: |
          env PYTHONPATH=src exabgp_log_enable=false pytest --cov --cov-reset ./tests

      - name: tiger style
        run: |
          ./qa/bin/check_tiger_style

      - name: every test file is collected
        run: |
          env PYTHONPATH=src exabgp_log_enable=false ./qa/bin/check_tests_run

      - name: every registry sweep notices a short registry
        run: |
          env PYTHONPATH=src exabgp_log_enable=false ./qa/bin/check_sweep_floors

      - name: pytest under python -O
        run: |
          env PYTHONPATH=src PYTHONOPTIMIZE=1 exabgp_log_enable=false pytest -q ./tests

      - name: compatibility against the last release
        run: |
          git fetch --tags --force
          ./qa/bin/compat_gate

  non-fuzz-dependency-boundary:
    # The full job installs qa/requirements.txt, including Hypothesis. That masks a
    # non-fuzz test which accidentally collects the fuzz suite in a nested pytest process.
    # Run the complete tree except the fuzz suite, so a new test directory remains covered
    # while Hypothesis leaking across the suite boundary fails this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install non-fuzz test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pytest pytest-asyncio pytest-benchmark pytest-cov pytest-timeout

      - name: pytest without Hypothesis
        run: |
          env PYTHONPATH=src exabgp_log_enable=false pytest --ignore=tests/fuzz --cov --cov-reset ./tests
