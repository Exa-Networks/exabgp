# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit Testing

on:
  push:
    branches: [main, 5.0, 4.2, 3.4]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    # runs-on: ubuntu-latest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: ["ubuntu-latest"]

    steps:
      - uses: actions/checkout@v7
        with:
          # compat_gate compares this change against the base of the pull request, so the
          # base commit has to be in the clone
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      # ./tests, not a list of paths.  This said ./tests/unit/test_*.py ./tests/fuzz/test_*.py,
      # which is a hand written enumeration of a tree that grew: the glob does not recurse,
      # so 34 files in subdirectories of tests/unit never ran here, nor did tests/integration,
      # tests/performance or tests/async_debug.  4341 tests ran of 5193 in the tree, and CI
      # was green about the 84%.  Naming the root is the only version of this which cannot
      # go stale as directories are added.
      - name: pytest
        run: |
          env PYTHONPATH=src exabgp_log_enable=false uv run pytest --cov --cov-reset ./tests

      # An assert which is doing real work passes every normal run and vanishes in
      # production. The BGP-LS decoder boundary was one statement of that shape: the assert
      # WAS the parse, so -O deleted it and the Notify came back out of the API writer.
      # 83 tests passed normally and 12 failed under -O. Nothing else catches it.
      - name: pytest with assertions removed
        run: |
          env PYTHONPATH=src PYTHONOPTIMIZE=1 exabgp_log_enable=false uv run pytest -q ./tests

      # A unit test asserts the NEW behaviour, so it can never notice that the new
      # behaviour is a peering somebody loses on upgrade. This decodes the same corpus in
      # this tree and in the last release and fails on anything the release accepts and
      # this one refuses. It found the VPLS exact length, the PMSI refusal, the empty IGP
      # tag list, a FlowSpec value in four bytes and a two byte AS4 capability.
      - name: compatibility with what the branch already accepts
        run: |
          uv run ./qa/bin/compat_gate

      # The ratchets: no bare except, no assert on wire data, and the long function and
      # silent except counts only ever go down.
      - name: tiger style
        run: |
          uv run ./qa/bin/check_tiger_style

      # A test file pytest does not collect reports nothing and looks like coverage.
      # tests/unit/nlri_tests.py held eighteen of them, twelve rotted, for a long time.
      - name: every test file is collected
        run: |
          uv run ./qa/bin/check_tests_run

      # A sweep parametrised from a registry does not fail when the registry is half
      # filled by import order, it runs fewer tests and stays green. 104 and 41 read the
      # same in a summary line.
      - name: no sweep shrinks silently
        run: |
          uv run ./qa/bin/check_sweep_floors
