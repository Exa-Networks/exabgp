name: Testing (Python 3.12+)

on:
  push:
    branches: [main, 5.0, 4.2, 3.4]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  functional-tests:
    # runs-on: ubuntu-latest
    runs-on: ${{ matrix.os }}
    # uv picks its interpreter from .python-version (3.12), not from setup-python: without
    # this every leg of the matrix ran on 3.12 and only the job name said otherwise
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        os: ["ubuntu-latest"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: run python version
        run: |
          python --version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check uv runs the Python of this leg
        run: |
          uv run python -c "import sys; v = '%d.%d' % sys.version_info[:2]; print(sys.version); raise SystemExit(v != '${{ matrix.python-version }}')"

      - name: Configuration
        run: |
          uv run ./qa/bin/functional parsing

      - name: Functional
        run: |
          uv run ./qa/bin/functional encoding

      - name: Decoding
        run: |
          uv run ./qa/bin/functional decoding

      - name: Configurations and helpers of 4.2 and 5.0
        run: |
          uv run ./qa/bin/test_old_scripts
