# Project metadata lives in pyproject.toml [project] and nowhere else: with two
# declarations setuptools silently picks one, and the loser rots. A [metadata]
# block here is what put a 3.7-only classifier list on the 5.0.9 PyPI page.
# What is left below has no pyproject equivalent.

[options]
zip_safe = False
include_package_data = True
packages = find:

[options.packages.find]
where = src
exclude =

[options.package_data]
* = *.txt, *.rst, *.json

# Configuration for mutmut (mutation testing)
# Run with: uv run mutmut run
[mutmut]
paths_to_mutate = src/exabgp/bgp/message/
tests_dir = tests/
runner = pytest -x -q tests/unit/
