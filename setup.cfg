# Project metadata lives in pyproject.toml [project] and nowhere else: with two
# declarations setuptools silently picks one, and the loser rots. The 3.7-only
# classifier list that reached PyPI for 5.0.9 came from a [metadata] block here.
# What is left below has no pyproject equivalent.

[options]
zip_safe = False
include_package_data = True
packages = find:

[options.packages.find]
where = src
exclude =

[options.package_data]
* = *.txt, *.rst
